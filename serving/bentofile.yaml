# =============================================================
# bentofile.yaml - BentoML 빌드 설정 파일
# =============================================================
#
# 이 파일의 역할:
#   BentoML로 서비스를 "패키징"할 때 필요한 설정을 정의
#   → 모델 + 코드 + 라이브러리를 하나로 묶어서 배포 가능한 형태로 만듦
#
# 비유:
#   이사할 때 박스에 뭘 넣을지 적어둔 "포장 목록"
#   - 어떤 서비스를 넣을지 (service)
#   - 어떤 파일들을 넣을지 (include)
#   - 어떤 라이브러리가 필요한지 (python.packages)
#
# 사용 방법:
#   bentoml build
#   → 이 파일을 읽고 Bento(배포 패키지)를 생성
#
# =============================================================

# ==================== 서비스 지정 ====================
#
# 형식: "파일명:클래스명"
# - service.py 파일의 MovieRatingService 클래스를 서비스로 사용
# - BentoML이 이 클래스를 HTTP API 서버로 실행함
service: "service:MovieRatingService"

# ==================== 라벨 (메타데이터) ====================
#
# 이 서비스에 대한 추가 정보 (태그 같은 것)
# 필수는 아니지만, 관리할 때 유용함
#
# 용도:
# - 누가 만들었는지, 어떤 프로젝트인지 기록
# - 나중에 검색하거나 필터링할 때 사용
# - 팀에서 여러 서비스를 관리할 때 구분용
labels:
  owner: team-2                    # 담당 팀
  project: movie-rating-predict    # 프로젝트 이름

# ==================== 포함할 파일 ====================
#
# Bento 패키지에 포함할 파일 목록
# "*.py": 현재 폴더의 모든 파이썬 파일 포함
#
# 다른 예시:
# - "src/*.py": src 폴더의 모든 .py 파일
# - "config.json": 특정 파일
# - "models/": models 폴더 전체
include:
  - "*.py"

# ==================== Python 설정 ====================
#
# 서비스 실행에 필요한 파이썬 라이브러리 목록
# → Bento 빌드 시 이 라이브러리들이 자동으로 설치됨
#
# requirements.txt와 비슷한 역할
python:
  packages:
    - bentoml        # BentoML 서비스 실행용
    - numpy          # 배열 연산용 (모델 입출력 처리)
    - scikit-learn   # scaler(정규화 도구) 사용에 필요
